name: make-ghcr-public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  set-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List and set package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "== list user container packages =="
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages?package_type=container" | tee /tmp/pkgs.json
          echo
          echo "== list by username =="
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/caoyadong888-wq/packages?package_type=container" | tee /tmp/pkgs2.json
          echo
          name="$(python3 -c 'import json; data=json.load(open("/tmp/pkgs.json")); print(data[0]["name"] if isinstance(data,list) and data else "")')"
          echo "detected name=${name}"
          if [ -z "${name}" ]; then
            name="$(python3 -c 'import json; data=json.load(open("/tmp/pkgs2.json")); print(data[0]["name"] if isinstance(data,list) and data else "pipeforge-demo")')"
          fi
          for path in \
            "user/packages/container/${name}/visibility" \
            "users/caoyadong888-wq/packages/container/${name}/visibility"
          do
            echo "== PUT ${path} =="
            code="$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/${path}" \
              -d '{"visibility":"public"}')"
            echo "HTTP ${code}"
            cat /tmp/out.json || true
            echo
            if [ "${code}" = "204" ] || [ "${code}" = "200" ]; then
              echo "SUCCESS"
              exit 0
            fi
          done
          # Also try POST (older docs)
          code="$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${name}/visibility" \
            -d '{"visibility":"public"}')"
          echo "POST HTTP ${code}"
          cat /tmp/out.json || true
          exit 1
