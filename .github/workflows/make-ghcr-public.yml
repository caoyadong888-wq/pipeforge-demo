# One-shot helper: set the GHCR package visibility to public.
# Safe to delete after a successful run. Does not deploy anywhere.
name: make-ghcr-public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  set-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: pipeforge-demo
        run: |
          set -euo pipefail
          # User package visibility endpoint
          code="$(curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE}/visibility" \
            -d '{"visibility":"public"}')"
          echo "HTTP ${code}"
          cat /tmp/pkg-vis.json || true
          case "${code}" in
            204|200|201) echo "package is public" ;;
            *)
              echo "visibility change failed" >&2
              exit 1
              ;;
          esac
