[project]
name = "ratecard-api"
version = "0.1.0"
description = "Fictional Kestrel Parcel Co. rate card API used by the PipeForge CI demo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "PipeForge demo contributors" }]
dependencies = [
  "fastapi>=0.142,<0.143",
  "starlette>=1.3.1",
  "uvicorn>=0.30,<0.31",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["app"]
mypy_path = "."

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
